name: Existing response tests

on:
  push:
    branches: [demo-base, codex/response-update]
  pull_request:
    branches: [demo-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install historical dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Run existing location and redirect suites
        run: node node_modules/mocha/bin/mocha.js --require test/support/env --reporter spec test/res.location.js test/res.redirect.js
